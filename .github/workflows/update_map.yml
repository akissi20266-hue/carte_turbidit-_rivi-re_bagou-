name: Mise à jour automatique de la carte de turbidité

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Date de début (AAAA-MM-JJ), optionnel — pour rattrapage'
        required: false
      end_date:
        description: 'Date de fin (AAAA-MM-JJ), optionnel — pour rattrapage'
        required: false
      season:
        description: 'seche ou pluie (requis si dates renseignées)'
        required: false
      year:
        description: 'Année à associer à cette couche (requis si dates renseignées)'
        required: false

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install earthengine-api

      - name: Écrire la clé du compte de service Earth Engine
        run: echo '${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}' > gee_key.json

      - name: Lancer l'export Earth Engine
        env:
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            python scripts/earth_engine_export.py \
              "${{ github.event.inputs.start_date }}" \
              "${{ github.event.inputs.end_date }}" \
              "${{ github.event.inputs.season }}" \
              "${{ github.event.inputs.year }}"
          else
            python scripts/earth_engine_export.py
          fi

      - name: Nettoyer la clé Earth Engine
        if: always()
        run: rm -f gee_key.json

      - name: Committer et pousser la nouvelle couche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Mise à jour automatique - $(date +'%Y-%m-%d')"
          git push
